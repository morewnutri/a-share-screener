[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-daily-scanner"
version = "0.1.0"
description = "End-of-day A-share main-board setup scanner with versioned caches and walk-forward diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ashare-daily-scanner contributors"}]
dependencies = [
  "exchange-calendars>=4.11,<5",
  "numpy>=1.26.4,<3",
  "pandas>=2.1,<3.1",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
ashare-scanner = "ashare_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
